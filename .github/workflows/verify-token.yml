name: Verify Public Repo Token

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Test Token Permissions
        env:
          GH_TOKEN: ${{ secrets.VOICE_BUDDY_REPO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::VOICE_BUDDY_REPO_ACCESS_TOKEN secret is empty!"
            exit 1
          fi

          echo "=== 1. Inspecting Token Headers & Scopes ==="
          curl -sI -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/user | grep -iE 'x-oauth-scopes|x-accepted-oauth-scopes|x-github-token-type|status'

          echo "=== 2. Inspecting Voice-Buddy Repo Permissions ==="
          curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/zfdang/voice-buddy | jq '{full_name: .full_name, private: .private, permissions: .permissions}'

          echo "=== 3. Testing Git Push with explicit credential override ==="
          rm -rf test-clone
          # Test with git -c credential.helper= so runner's default credential helper cannot intercept
          git -c credential.helper= clone "https://${GH_TOKEN}@github.com/zfdang/voice-buddy.git" test-clone
          cd test-clone
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git -c credential.helper= push --dry-run origin main
          echo "=== Success: Token has full git push access to zfdang/voice-buddy ==="
