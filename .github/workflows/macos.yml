name: macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm/artifacts
            .build
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-${{ hashFiles('Package.resolved', 'Package.swift') }}-
            ${{ runner.os }}-${{ runner.arch }}-swift-

      - name: Run tests
        run: swift test -j 4

      - name: Build and smoke-test macOS application package
        run: |
          scripts/build-app.sh release --package -s - --allow-adhoc
          test -d "dist/Voice Buddy.app"
          plutil -lint "dist/Voice Buddy.app/Contents/Info.plist"
          test -f dist/Voice-Buddy-*-macOS.dmg
          test -f dist/Voice-Buddy-*-macOS.zip
          test -s "dist/SHA256SUMS.txt"
          codesign --verify --deep --strict "dist/Voice Buddy.app"
          /usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" "dist/Voice Buddy.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :SUFeedURL" "dist/Voice Buddy.app/Contents/Info.plist"

  signed-development-build:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      CERTIFICATE_BASE64: ${{ secrets.VOICE_BUDDY_SIGNING_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.VOICE_BUDDY_SIGNING_P12_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm/artifacts
            .build
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-${{ hashFiles('Package.resolved', 'Package.swift') }}-
            ${{ runner.os }}-${{ runner.arch }}-swift-

      - name: Import development signing identity and build
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE_BASE64" || -z "$P12_PASSWORD" ]]; then
            echo "The development signing secrets are not configured." >&2
            exit 1
          fi
          certificate="$RUNNER_TEMP/voice-buddy-development.p12"
          keychain="$RUNNER_TEMP/voice-buddy-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain"
          security import "$certificate" -k "$keychain" -P "$P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" || true

          scripts/build-app.sh release --strict-signing -s "Voice Buddy Local Development"

          echo "Verifying code signature..."
          codesign --verify --deep --strict "dist/Voice Buddy.app"
          sig_info="$(codesign -dvvv "dist/Voice Buddy.app" 2>&1)"
          echo "$sig_info"
          if echo "$sig_info" | grep -q "Signature=adhoc"; then
            echo "::error::Signed development build resulted in adhoc signature!"
            exit 1
          fi

          ditto -c -k --keepParent 'dist/Voice Buddy.app' "$RUNNER_TEMP/Voice-Buddy-development.zip"

      - name: Cleanup signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/voice-buddy-signing.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain" || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Voice-Buddy-development
          path: ${{ runner.temp }}/Voice-Buddy-development.zip
          retention-days: 7
