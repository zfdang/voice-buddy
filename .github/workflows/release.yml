name: Release macOS App

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v1.3.0). Leave empty to auto-calculate from Conventional Commits'
        required: false
        default: ''
        type: string
      sign_existing:
        description: 'Only sign an existing local-build release ZIP for Sparkle'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
      run_tests:
        description: 'Run full debug test suite before packaging (skip by default for faster releases)'
        required: false
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  release:
    name: Build, Sign & Publish Release
    if: github.event_name != 'workflow_dispatch' || !inputs.sign_existing
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CERTIFICATE_BASE64: ${{ secrets.VOICE_BUDDY_SIGNING_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.VOICE_BUDDY_SIGNING_P12_PASSWORD }}
      SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Xcode toolchain
        id: xcode
        run: |
          for xcode_path in "/Applications/Xcode_26.3.app" "/Applications/Xcode_26.2.app" "/Applications/Xcode_26.1.1.app" "/Applications/Xcode_26.0.1.app" "/Applications/Xcode.app"; do
            if [ -d "$xcode_path/Contents/Developer" ]; then
              echo "Selecting toolchain at $xcode_path..."
              sudo xcode-select -s "$xcode_path/Contents/Developer"
              echo "DEVELOPER_DIR=$xcode_path/Contents/Developer" >> "$GITHUB_ENV"
              export DEVELOPER_DIR="$xcode_path/Contents/Developer"
              break
            fi
          done
          dev_dir="${DEVELOPER_DIR:-$(xcode-select -p)}"
          xcode_id="$(basename "$(dirname "$(dirname "$dev_dir")")" .app)"
          echo "xcode_id=$xcode_id" >> "$GITHUB_OUTPUT"
          echo "Selected Swift toolchain version ($xcode_id):"
          swift --version

      - name: Resolve release version tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet origin || true

          tag="${INPUT_TAG:-}"
          if [[ -z "$tag" && "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          fi

          if [[ -z "$tag" ]]; then
            echo "No release tag provided. Calculating next Semantic Version based on Conventional Commits..."
            tag="$(python3 scripts/compute-next-version.py --format tag)"
            echo "Auto-computed next Semantic Version: $tag"
          fi

          if ! printf '%s' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::Invalid version format '$tag'. Expected v<semver>, e.g. v0.1.0 or v1.3.0"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify release commit on main
        id: commit
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet origin || true
          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main || true

          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists in repository. Checking out existing tag commit..."
            git checkout -f "refs/tags/$TAG"
          else
            echo "Tag $TAG does not exist yet. Using current checked-out commit on main..."
          fi

          sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$sha" origin/main || {
            echo "::error::Commit $sha must be an ancestor of origin/main"
            exit 1
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM release cache
        id: swift-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm/artifacts
            .build
            !.build/mlx-metallib-cache
            !.build/arm64-apple-macosx/debug
          key: ${{ runner.os }}-${{ runner.arch }}-swift-v2-${{ steps.xcode.outputs.xcode_id }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ steps.commit.outputs.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-v2-${{ steps.xcode.outputs.xcode_id }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-
            ${{ runner.os }}-${{ runner.arch }}-swift-v2-${{ steps.xcode.outputs.xcode_id }}-

      - name: Restore MLX Metal shader cache
        id: metallib-cache
        uses: actions/cache/restore@v6
        with:
          path: .build/mlx-metallib-cache
          key: ${{ runner.os }}-${{ runner.arch }}-mlx-metallib-v1-${{ steps.xcode.outputs.xcode_id }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mlx-metallib-v1-${{ steps.xcode.outputs.xcode_id }}-

      - name: Restore Git timestamps for incremental build
        run: python3 scripts/restore-git-mtimes.py --marker-file .build/.cached-git-sha

      - name: Run unit tests
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests
        run: swift test -j "$(sysctl -n hw.ncpu 2>/dev/null || echo 4)"

      - name: Import release signing certificate
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE_BASE64" || -z "$P12_PASSWORD" ]]; then
            echo "Signing secrets are missing or incomplete." >&2
            exit 1
          fi
          certificate="$RUNNER_TEMP/voice-buddy-signing.p12"
          keychain="$RUNNER_TEMP/voice-buddy-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain"
          security import "$certificate" -k "$keychain" -P "$P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" || true

          echo "Discovered codesigning identities in keychain:"
          security find-identity -v -p codesigning "$keychain"

      - name: Build, sign & package release
        id: build
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          keychain="$RUNNER_TEMP/voice-buddy-signing.keychain-db"

          # Discover signing identity: Secret -> Keychain -> Fallback
          signing_id="${APPLE_SIGNING_IDENTITY:-}"
          if [[ -z "$signing_id" ]]; then
            dev_id="$(security find-identity -v -p codesigning "$keychain" 2>/dev/null | grep 'Developer ID Application' | head -n 1 | awk -F '"' '{print $2}' || true)"
            if [[ -n "$dev_id" ]]; then
              signing_id="$dev_id"
            else
              any_id="$(security find-identity -v -p codesigning "$keychain" 2>/dev/null | awk -F '"' '/"/ {print $2; exit}' || true)"
              signing_id="${any_id:-Voice Buddy Local Development}"
            fi
          fi
          echo "Selected codesigning identity: $signing_id"

          scripts/build-app.sh release "$tag" --package --strict-signing -s "$signing_id"

          # Verify the app bundle is strictly signed with valid certificate
          echo "Verifying release app signature..."
          codesign --verify --deep --strict "dist/Voice Buddy.app"
          sig_info="$(codesign -dvvv "dist/Voice Buddy.app" 2>&1)"
          echo "$sig_info"
          if echo "$sig_info" | grep -q "Signature=adhoc"; then
            echo "::error::Release build was signed with ad-hoc signature! Expected valid certificate."
            exit 1
          fi
          if echo "$sig_info" | grep -q "flags=.*(runtime)" && echo "$sig_info" | grep -q "TeamIdentifier=not set"; then
            echo "::error::Release build enabled Hardened Runtime without a TeamIdentifier; embedded frameworks would fail dyld Team ID check."
            exit 1
          fi

      - name: Apple notarization & stapling
        id: notarize
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          raw_tag="${tag#v}"
          zip_file="dist/Voice-Buddy-${tag}-macOS.zip"
          [[ -f "$zip_file" ]] || zip_file="dist/Voice-Buddy-${raw_tag}-macOS.zip"
          dmg_file="dist/Voice-Buddy-${tag}-macOS.dmg"
          [[ -f "$dmg_file" ]] || dmg_file="dist/Voice-Buddy-${raw_tag}-macOS.dmg"

          if [[ -n "${APPLE_API_KEY_BASE64:-}" && -n "${APPLE_API_KEY_ID:-}" && -n "${APPLE_API_ISSUER:-}" ]]; then
            echo "Notarizing artifacts via App Store Connect API Key..."
            api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$api_key_path"
            xcrun notarytool submit "$zip_file" \
              --key "$api_key_path" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
            xcrun stapler staple "dist/Voice Buddy.app"
            xcrun notarytool submit "$dmg_file" \
              --key "$api_key_path" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
            xcrun stapler staple "$dmg_file"
          elif [[ -n "${APPLE_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
            echo "Notarizing artifacts via Apple ID and App-Specific Password..."
            xcrun notarytool submit "$zip_file" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "dist/Voice Buddy.app"
            xcrun notarytool submit "$dmg_file" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$dmg_file"
          else
            echo "Skipping notarization: Apple API credentials not provided."
          fi

          # If stapling succeeded, recreate the zip so the stapled ticket is included in the archive
          if [[ -n "${APPLE_API_KEY_BASE64:-}" || -n "${APPLE_ID:-}" ]]; then
            echo "Re-archiving zip to include notarization staple ticket..."
            rm -f "$zip_file"
            ditto -c -k --keepParent "dist/Voice Buddy.app" "$zip_file"
          fi

          # Recompute SHA256 checksums
          (cd dist && shasum -a 256 "${zip_file##*/}" "${dmg_file##*/}" > SHA256SUMS.txt)

      - name: Generate Sparkle appcast & EdDSA signature
        id: sparkle
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          COMMIT: ${{ steps.commit.outputs.sha }}
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: |
          set -euo pipefail
          raw_tag="${TAG#v}"
          zip_file="dist/Voice-Buddy-${TAG}-macOS.zip"
          [[ -f "$zip_file" ]] || zip_file="dist/Voice-Buddy-${raw_tag}-macOS.zip"

          if [[ -z "${SPARKLE_ED_KEY:-}" ]]; then
            echo "::error::SPARKLE_ED_KEY secret is required for signing release updates!"
            exit 1
          fi

          app_plist="dist/Voice Buddy.app/Contents/Info.plist"
          embedded_pubkey="$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" "$app_plist" 2>/dev/null || true)"
          if [[ -z "$embedded_pubkey" ]]; then
            echo "::error::SUPublicEDKey is missing from $app_plist!"
            exit 1
          fi

          derived_pubkey="$(swift -e '
          import CryptoKit
          import Foundation
          guard let privData = Data(base64Encoded: CommandLine.arguments[1]),
                let priv = try? Curve25519.Signing.PrivateKey(rawRepresentation: privData) else {
              exit(1)
          }
          print(priv.publicKey.rawRepresentation.base64EncodedString())
          ' "$SPARKLE_ED_KEY" 2>/dev/null || true)"

          if [[ "$derived_pubkey" != "$embedded_pubkey" ]]; then
            echo "::error::SPARKLE_ED_KEY secret does not match SUPublicEDKey in the app ($embedded_pubkey vs derived $derived_pubkey)!"
            exit 1
          fi
          echo "Verified SPARKLE_ED_KEY matches app SUPublicEDKey ($embedded_pubkey)."

          appcast_stage="$RUNNER_TEMP/sparkle_appcast"
          mkdir -p "$appcast_stage"
          cp "$zip_file" "$appcast_stage/"

          # Fetch existing appcast.xml from local repo to preserve update history
          if [[ -f appcast.xml ]]; then
            cp appcast.xml "$appcast_stage/appcast.xml"
          fi

          appcast_tool="$(find .build -name generate_appcast -type f -perm +111 2>/dev/null | head -n 1 || true)"
          if [[ -z "$appcast_tool" ]]; then
            echo "generate_appcast not found in .build, compiling from Sparkle source..."
            swift build -c release --product generate_appcast
            appcast_tool="$(find .build -name generate_appcast -type f -perm +111 2>/dev/null | head -n 1)"
          fi

          # Sparkle downloads point directly to myvoicebuddy.com for fast local access without GitHub blocking
          download_prefix="https://myvoicebuddy.com/downloads/"

          channel_args=()
          if [[ "$raw_tag" =~ -(alpha|beta|rc) ]]; then
            channel_args=(--channel "${BASH_REMATCH[1]}")
          elif [[ "$raw_tag" =~ - ]]; then
            channel_args=(--channel "beta")
          fi

          printf '%s' "$SPARKLE_ED_KEY" | "$appcast_tool" ${channel_args[@]+"${channel_args[@]}"} --ed-key-file - --download-url-prefix "$download_prefix" "$appcast_stage"

          cp "$appcast_stage/appcast.xml" "dist/appcast.xml"
          echo "Generated dist/appcast.xml:"
          cat "dist/appcast.xml"

      - name: Save MLX Metal shader cache
        if: steps.metallib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build/mlx-metallib-cache
          key: ${{ runner.os }}-${{ runner.arch }}-mlx-metallib-v1-${{ steps.xcode.outputs.xcode_id }}-${{ hashFiles('Package.resolved') }}

      - name: Record build cache commit marker
        if: steps.swift-cache.outputs.cache-hit != 'true'
        run: python3 scripts/restore-git-mtimes.py --marker-file .build/.cached-git-sha --write-marker

      - name: Save SwiftPM release cache
        if: steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm/artifacts
            .build
            !.build/mlx-metallib-cache
            !.build/arm64-apple-macosx/debug
          key: ${{ runner.os }}-${{ runner.arch }}-swift-v2-${{ steps.xcode.outputs.xcode_id }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ steps.commit.outputs.sha }}

      - name: Publish GitHub Release
        id: publish
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          COMMIT: ${{ steps.commit.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          raw_tag="${TAG#v}"
          zip_file="dist/Voice-Buddy-${TAG}-macOS.zip"
          [[ -f "$zip_file" ]] || zip_file="dist/Voice-Buddy-${raw_tag}-macOS.zip"
          dmg_file="dist/Voice-Buddy-${TAG}-macOS.dmg"
          [[ -f "$dmg_file" ]] || dmg_file="dist/Voice-Buddy-${raw_tag}-macOS.dmg"
          checksum_file="dist/SHA256SUMS.txt"
          appcast_file="dist/appcast.xml"

          if [[ ! -f "$zip_file" || ! -f "$dmg_file" || ! -f "$checksum_file" ]]; then
            echo "::error::Release assets missing from dist/"
            exit 1
          fi

          prerelease_flag=""
          if [[ "${{ github.event.inputs.prerelease }}" == "true" || "$raw_tag" =~ - ]]; then
            prerelease_flag="--prerelease"
            echo "Configuring GitHub Release as pre-release for tag ${TAG}."
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          python3 scripts/generate-release-notes.py \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --dmg-file "$dmg_file" \
            --checksums-file "$checksum_file" \
            --repository "${GITHUB_REPOSITORY:-zfdang/voice-buddy}" \
            --output "$notes_file"

          echo "Checking if release $TAG exists in $GITHUB_REPOSITORY..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading assets and updating notes..."
            gh release upload "$TAG" "$dmg_file" "$zip_file" "$checksum_file" "$appcast_file" --clobber
            gh release edit "$TAG" --notes-file "$notes_file" $prerelease_flag
          else
            echo "Creating new release for $TAG in $GITHUB_REPOSITORY..."
            gh release create "$TAG" "$dmg_file" "$zip_file" "$checksum_file" "$appcast_file" \
              --title "Voice Buddy ${TAG}" \
              --notes-file "$notes_file" \
              --target "$COMMIT" \
              $prerelease_flag
          fi

      - name: Commit updated appcast.xml to main
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp dist/appcast.xml ./appcast.xml
          git add appcast.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update appcast.xml for ${TAG} [skip ci]"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "Successfully updated appcast.xml in main branch."
                break
              fi
              if [[ "$attempt" -eq 3 ]]; then
                echo "::error::Failed to push updated appcast.xml to main after 3 attempts."
                exit 1
              fi
              sleep 2
            done
          else
            echo "appcast.xml already up to date in main."
          fi

      - name: Upload website update feeds artifact
        uses: actions/upload-artifact@v7
        with:
          name: website-update-feeds
          path: |
            dist/appcast.xml
            dist/Voice-Buddy-*.dmg
            dist/Voice-Buddy-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Write release summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          {
            echo "## Release $TAG published"
            echo "- **Source Commit**: $COMMIT"
            echo "- **GitHub Release**: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo "- **Pages Download Mirror**: https://myvoicebuddy.com/downloads/"
            echo "- **Artifacts**:"
            echo "  - \`dist/Voice-Buddy-${TAG}-macOS.dmg\`"
            echo "  - \`dist/Voice-Buddy-${TAG}-macOS.zip\`"
            echo "  - \`dist/appcast.xml\`"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/voice-buddy-signing.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain" || true
          fi

  sign-existing:
    name: Re-sign Existing Release Appcast
    if: github.event_name == 'workflow_dispatch' && inputs.sign_existing
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download, verify & sign existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
          TAG: ${{ inputs.tag }}
        run: bash scripts/sign-existing-release.sh
      - name: Upload signed appcast.xml
        uses: actions/upload-artifact@v7
        with:
          name: signed-appcast-${{ inputs.tag }}
          path: dist/appcast.xml
          if-no-files-found: error
