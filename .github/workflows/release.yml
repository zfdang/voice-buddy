name: Release macOS App

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-app-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  PUBLIC_REPO: zfdang/voice-buddy

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CERTIFICATE_BASE64: ${{ secrets.VOICE_BUDDY_SIGNING_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.VOICE_BUDDY_SIGNING_P12_PASSWORD }}
      PUBLIC_REPO_TOKEN: ${{ secrets.VOICE_BUDDY_REPO_ACCESS_TOKEN }}
      SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if ! printf '%s' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo '::error::expected v<semver>, e.g. v0.1.0 or v1.0.0-rc1'
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit is on main
        id: commit
        run: |
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
          sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$sha" origin/main
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run test suite
        run: swift test -j 4

      - name: Setup signing keychain
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE_BASE64" || -z "$P12_PASSWORD" ]]; then
            echo "Signing secrets are missing or incomplete." >&2
            exit 1
          fi
          certificate="$RUNNER_TEMP/voice-buddy-signing.p12"
          public_certificate="$RUNNER_TEMP/voice-buddy-signing.pem"
          keychain="$RUNNER_TEMP/voice-buddy-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate"
          openssl pkcs12 -in "$certificate" -passin env:P12_PASSWORD -clcerts -nokeys -out "$public_certificate"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security import "$certificate" -k "$keychain" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security add-trusted-cert -r trustRoot -p codeSign -k "$keychain" "$public_certificate"

      - name: Build and package signed release
        id: build
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          scripts/build-app.sh release "$tag" --package

      - name: Generate Sparkle Appcast
        id: appcast
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          raw_tag="${TAG#v}"
          zip_file="dist/Voice-Buddy-${TAG}-macOS.zip"
          if [[ ! -f "$zip_file" ]]; then
            zip_file="dist/Voice-Buddy-${raw_tag}-macOS.zip"
          fi

          appcast_stage="$RUNNER_TEMP/sparkle_appcast"
          mkdir -p "$appcast_stage"
          cp "$zip_file" "$appcast_stage/"

          # Fetch existing appcast.xml from public repo if available to keep update history
          curl -fsSL "https://raw.githubusercontent.com/${PUBLIC_REPO}/main/appcast.xml" -o "$appcast_stage/appcast.xml" || true

          appcast_tool="$(find .build -name generate_appcast -type f -perm +111 2>/dev/null | head -n 1 || true)"
          if [[ -z "$appcast_tool" ]]; then
            echo "generate_appcast not found in .build, compiling from Sparkle source..."
            swift build -c release --product generate_appcast
            appcast_tool="$(find .build -name generate_appcast -type f -perm +111 2>/dev/null | head -n 1)"
          fi

          download_prefix="https://github.com/${PUBLIC_REPO}/releases/download/${TAG}/"

          if [[ -n "${SPARKLE_ED_KEY:-}" ]]; then
            printf '%s' "$SPARKLE_ED_KEY" | "$appcast_tool" --ed-key-file - --download-url-prefix "$download_prefix" "$appcast_stage"
          else
            "$appcast_tool" --download-url-prefix "$download_prefix" "$appcast_stage"
          fi

          cp "$appcast_stage/appcast.xml" "dist/appcast.xml"
          echo "Generated dist/appcast.xml:"
          cat "dist/appcast.xml"

      - name: Publish Release to Public Repository
        id: publish
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          COMMIT: ${{ steps.commit.outputs.sha }}
          GH_TOKEN: ${{ secrets.VOICE_BUDDY_REPO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          raw_tag="${TAG#v}"
          zip_file="dist/Voice-Buddy-${TAG}-macOS.zip"
          if [[ ! -f "$zip_file" ]]; then
            zip_file="dist/Voice-Buddy-${raw_tag}-macOS.zip"
          fi
          dmg_file="dist/Voice-Buddy-${TAG}-macOS.dmg"
          if [[ ! -f "$dmg_file" ]]; then
            dmg_file="dist/Voice-Buddy-${raw_tag}-macOS.dmg"
          fi
          checksum_file="dist/SHA256SUMS.txt"
          appcast_file="dist/appcast.xml"

          if [[ ! -f "$zip_file" || ! -f "$dmg_file" || ! -f "$checksum_file" ]]; then
            echo "::error::Release assets missing from dist/"
            exit 1
          fi

          release_notes="## Voice Buddy ${TAG}

- **Commit**: \`${COMMIT}\`
- **Architecture**: Apple Silicon (M1/M2/M3/M4) / macOS 15.0+
- **Offline-first voice typing with local Qwen3-ASR and Qwen LLM**

### Sparkle Update Feed
- Automated update feed available at: \`https://raw.githubusercontent.com/${PUBLIC_REPO}/main/appcast.xml\`

### SHA256 Checksums
\`\`\`
$(cat "$checksum_file")
\`\`\`"

          echo "Checking if release $TAG exists in $PUBLIC_REPO..."
          if gh release view "$TAG" --repo "$PUBLIC_REPO" >/dev/null 2>&1; then
            echo "Release $TAG exists in $PUBLIC_REPO, uploading assets and updating notes..."
            gh release upload "$TAG" "$dmg_file" "$zip_file" "$checksum_file" "$appcast_file" --repo "$PUBLIC_REPO" --clobber
            gh release edit "$TAG" --repo "$PUBLIC_REPO" --notes "$release_notes"
          else
            echo "Creating new release for $TAG in $PUBLIC_REPO..."
            gh release create "$TAG" "$dmg_file" "$zip_file" "$checksum_file" "$appcast_file" \
              --repo "$PUBLIC_REPO" \
              --title "Voice Buddy ${TAG}" \
              --notes "$release_notes"
          fi

      - name: Update appcast.xml in Public Repository
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "${PUBLIC_REPO_TOKEN:-}" ]]; then
            echo "::warning::PUBLIC_REPO_TOKEN is not set, skipping appcast.xml push to public repo"
            exit 0
          fi

          pub_stage="$RUNNER_TEMP/public-repo"
          rm -rf "$pub_stage"
          git -c credential.helper= clone "https://${PUBLIC_REPO_TOKEN}@github.com/${PUBLIC_REPO}.git" "$pub_stage"
          cd "$pub_stage"
          cp "$GITHUB_WORKSPACE/dist/appcast.xml" ./appcast.xml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet appcast.xml; then
            git add appcast.xml
            git commit -m "chore(release): update appcast.xml for ${TAG}"
            git -c credential.helper= push origin main
            echo "Successfully updated appcast.xml in ${PUBLIC_REPO} main branch."
          else
            echo "appcast.xml already up to date in ${PUBLIC_REPO}."
          fi

      - name: Deployment Summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          {
            echo "## Release $TAG published to $PUBLIC_REPO"
            echo "- **Source Commit**: $COMMIT"
            echo "- **Public Release**: https://github.com/${PUBLIC_REPO}/releases/tag/${TAG}"
            echo "- **Artifacts**:"
            echo "  - \`dist/Voice-Buddy-${TAG}-macOS.dmg\`"
            echo "  - \`dist/Voice-Buddy-${TAG}-macOS.zip\`"
            echo "  - \`dist/appcast.xml\`"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
