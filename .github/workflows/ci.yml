name: Build & Test

on:
  push:
    branches: [main]
    paths-ignore:
      - 'pages/**'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'pages/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: Test & Build App Bundle
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Xcode toolchain
        id: xcode
        run: |
          for xcode_path in "/Applications/Xcode_26.3.app" "/Applications/Xcode_26.2.app" "/Applications/Xcode_26.1.1.app" "/Applications/Xcode_26.0.1.app" "/Applications/Xcode.app"; do
            if [ -d "$xcode_path/Contents/Developer" ]; then
              echo "Selecting toolchain at $xcode_path..."
              sudo xcode-select -s "$xcode_path/Contents/Developer"
              echo "DEVELOPER_DIR=$xcode_path/Contents/Developer" >> "$GITHUB_ENV"
              export DEVELOPER_DIR="$xcode_path/Contents/Developer"
              break
            fi
          done
          dev_dir="${DEVELOPER_DIR:-$(xcode-select -p)}"
          xcode_id="$(basename "$(dirname "$(dirname "$dev_dir")")" .app)"
          echo "xcode_id=$xcode_id" >> "$GITHUB_OUTPUT"
          echo "Selected Swift toolchain version ($xcode_id):"
          swift --version

      - name: Restore SwiftPM build cache
        id: swift-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm/artifacts
            .build
            !.build/mlx-metallib-cache
          key: ${{ runner.os }}-${{ runner.arch }}-swift-tests-v2-${{ steps.xcode.outputs.xcode_id }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-tests-v2-${{ steps.xcode.outputs.xcode_id }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-
            ${{ runner.os }}-${{ runner.arch }}-swift-tests-v2-${{ steps.xcode.outputs.xcode_id }}-

      - name: Restore MLX Metal shader cache
        id: metallib-cache
        uses: actions/cache/restore@v6
        with:
          path: .build/mlx-metallib-cache
          key: ${{ runner.os }}-${{ runner.arch }}-mlx-metallib-v1-${{ steps.xcode.outputs.xcode_id }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mlx-metallib-v1-${{ steps.xcode.outputs.xcode_id }}-

      - name: Restore Git timestamps for incremental build
        run: python3 scripts/restore-git-mtimes.py --marker-file .build/.cached-git-sha

      - name: Run release script unit tests
        run: python3 -m unittest -v scripts/test_generate_release_notes.py

      - name: Run unit tests
        run: swift test -j "$(sysctl -n hw.ncpu 2>/dev/null || echo 4)"

      - name: Build & verify macOS app bundle
        run: |
          scripts/build-app.sh release --package -s - --allow-adhoc
          test -d "dist/Voice Buddy.app"
          plutil -lint "dist/Voice Buddy.app/Contents/Info.plist"
          test -f dist/Voice-Buddy-*-macOS.dmg
          test -f dist/Voice-Buddy-*-macOS.zip
          test -s "dist/SHA256SUMS.txt"
          codesign --verify --deep --strict "dist/Voice Buddy.app"
          /usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" "dist/Voice Buddy.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :SUFeedURL" "dist/Voice Buddy.app/Contents/Info.plist"

      - name: Save MLX Metal shader cache
        if: steps.metallib-cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@v6
        with:
          path: .build/mlx-metallib-cache
          key: ${{ runner.os }}-${{ runner.arch }}-mlx-metallib-v1-${{ steps.xcode.outputs.xcode_id }}-${{ hashFiles('Package.resolved') }}

      - name: Record build cache commit marker
        if: steps.swift-cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: python3 scripts/restore-git-mtimes.py --marker-file .build/.cached-git-sha --write-marker

      - name: Save SwiftPM build cache
        if: steps.swift-cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm/artifacts
            .build
            !.build/mlx-metallib-cache
          key: ${{ runner.os }}-${{ runner.arch }}-swift-tests-v2-${{ steps.xcode.outputs.xcode_id }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}

  signed-development-build:
    name: Build Signed Dev App
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      CERTIFICATE_BASE64: ${{ secrets.VOICE_BUDDY_SIGNING_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.VOICE_BUDDY_SIGNING_P12_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Xcode toolchain
        id: xcode
        run: |
          for xcode_path in "/Applications/Xcode_26.3.app" "/Applications/Xcode_26.2.app" "/Applications/Xcode_26.1.1.app" "/Applications/Xcode_26.0.1.app" "/Applications/Xcode.app"; do
            if [ -d "$xcode_path/Contents/Developer" ]; then
              echo "Selecting toolchain at $xcode_path..."
              sudo xcode-select -s "$xcode_path/Contents/Developer"
              echo "DEVELOPER_DIR=$xcode_path/Contents/Developer" >> "$GITHUB_ENV"
              export DEVELOPER_DIR="$xcode_path/Contents/Developer"
              break
            fi
          done
          dev_dir="${DEVELOPER_DIR:-$(xcode-select -p)}"
          xcode_id="$(basename "$(dirname "$(dirname "$dev_dir")")" .app)"
          echo "xcode_id=$xcode_id" >> "$GITHUB_OUTPUT"
          echo "Selected Swift toolchain version ($xcode_id):"
          swift --version

      - name: Restore SwiftPM release cache
        id: swift-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm/artifacts
            .build
            !.build/mlx-metallib-cache
            !.build/arm64-apple-macosx/debug
          key: ${{ runner.os }}-${{ runner.arch }}-swift-v2-${{ steps.xcode.outputs.xcode_id }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-v2-${{ steps.xcode.outputs.xcode_id }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-
            ${{ runner.os }}-${{ runner.arch }}-swift-v2-${{ steps.xcode.outputs.xcode_id }}-

      - name: Restore MLX Metal shader cache
        id: metallib-cache
        uses: actions/cache/restore@v6
        with:
          path: .build/mlx-metallib-cache
          key: ${{ runner.os }}-${{ runner.arch }}-mlx-metallib-v1-${{ steps.xcode.outputs.xcode_id }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mlx-metallib-v1-${{ steps.xcode.outputs.xcode_id }}-

      - name: Restore Git timestamps for incremental build
        run: python3 scripts/restore-git-mtimes.py --marker-file .build/.cached-git-sha

      - name: Import dev certificate, build & sign app
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE_BASE64" || -z "$P12_PASSWORD" ]]; then
            echo "The development signing secrets are not configured." >&2
            exit 1
          fi
          certificate="$RUNNER_TEMP/voice-buddy-development.p12"
          keychain="$RUNNER_TEMP/voice-buddy-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain"
          security import "$certificate" -k "$keychain" -P "$P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" || true

          scripts/build-app.sh release --strict-signing -s "Voice Buddy Local Development"

          echo "Verifying code signature..."
          codesign --verify --deep --strict "dist/Voice Buddy.app"
          sig_info="$(codesign -dvvv "dist/Voice Buddy.app" 2>&1)"
          echo "$sig_info"
          if echo "$sig_info" | grep -q "Signature=adhoc"; then
            echo "::error::Signed development build resulted in adhoc signature!"
            exit 1
          fi

          ditto -c -k --keepParent 'dist/Voice Buddy.app' "$RUNNER_TEMP/Voice-Buddy-development.zip"

      - name: Save MLX Metal shader cache
        if: steps.metallib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build/mlx-metallib-cache
          key: ${{ runner.os }}-${{ runner.arch }}-mlx-metallib-v1-${{ steps.xcode.outputs.xcode_id }}-${{ hashFiles('Package.resolved') }}

      - name: Record build cache commit marker
        if: steps.swift-cache.outputs.cache-hit != 'true'
        run: python3 scripts/restore-git-mtimes.py --marker-file .build/.cached-git-sha --write-marker

      - name: Save SwiftPM release cache
        if: steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm/artifacts
            .build
            !.build/mlx-metallib-cache
            !.build/arm64-apple-macosx/debug
          key: ${{ runner.os }}-${{ runner.arch }}-swift-v2-${{ steps.xcode.outputs.xcode_id }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}

      - name: Cleanup signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/voice-buddy-signing.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain" || true
          fi
      - name: Upload signed dev build
        uses: actions/upload-artifact@v7
        with:
          name: Voice-Buddy-development
          path: ${{ runner.temp }}/Voice-Buddy-development.zip
          retention-days: 7
